name: SnapWeb
options:
  bundleIdPrefix: com.christianrelf
  deploymentTarget:
    iOS: "16.0"
targets:
  SnapWeb:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: SnapWeb
        excludes: ["*.js"]
      - path: SnapWeb/spoof.js
        buildPhase: resources
    info:
      path: SnapWeb/Info.plist
      properties:
        CFBundleDisplayName: Snap Web
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Snapchat uses the camera to take snaps and make video calls.
        NSMicrophoneUsageDescription: Snapchat uses the microphone to record snaps and make calls.
        NSPhotoLibraryUsageDescription: Lets you send photos and videos from your library.
        NSPhotoLibraryAddUsageDescription: Lets you save snaps to your library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.christianrelf.snapweb
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
